<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPKA Office</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPKA Office">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1117">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0e1117; color:#e8ecf3;
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; }
  .box { max-width:340px; padding:24px; }
  img { width:120px; height:120px; border-radius:28px; }
  h1 { font-size:22px; margin:16px 0 6px; }
  a.btn { display:inline-block; margin-top:18px; background:#d6b04c; color:#1a1405; font-weight:700; padding:12px 22px; border-radius:12px; text-decoration:none; }
  .how { margin-top:22px; color:#8b95a7; font-size:13px; text-align:left; background:#161b24; border:1px solid #262d3a; border-radius:12px; padding:12px 14px; }
</style>
</head>
<body>
<div class="box">
  <img src="icon-180.png" alt="SPKA Office">
  <h1>SPKA Office</h1>
  <div style="color:#8b95a7">Pejabat maya SPKA Department</div>
  <a class="btn" id="go" href="#">Buka SPKA Office</a>
  <div class="how" id="how">
    <b>Letak ikon di home screen:</b><br>
    iPhone (Safari): tekan <b>Share ⬆️ → Add to Home Screen → Add</b><br>
    Android (Chrome): tekan <b>⋮ → Add to Home screen</b>
  </div>
</div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbwdkIllAhkVvi5yqAZlzBGUTT6wECSXTshw6fKPRQecdh2T-sjeIN2FIYD3u5E_aS3QDA/exec?view=office';
  document.getElementById('go').href = APP;
  var fromHome = window.navigator.standalone === true ||
                 (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                 /[?&]app=1/.test(location.search);
  if (fromHome) { document.getElementById('how').style.display = 'none'; location.replace(APP); }
</script>
</body>
</html>
